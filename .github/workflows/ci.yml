name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install e2e harness dependencies (tmux, sshd, lsof)
        run: |
          need=""
          command -v tmux >/dev/null || need="$need tmux"
          command -v sshd >/dev/null || test -x /usr/sbin/sshd || need="$need openssh-server"
          command -v lsof >/dev/null || need="$need lsof"
          if [ -n "$need" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq $need; fi
          # sshd needs its privilege-separation directory to exist even when
          # a test runs it as an unprivileged user on a high port.
          sudo mkdir -p /run/sshd

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Cross-compile all supported platforms
        run: make -j4 cross
